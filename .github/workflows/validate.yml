name: validate-data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Godot 無しで data/*.json とフィールド地図の整合性を検査する（scripts/tools/validate_data.gd の Python 版）
      - run: python3 docs/tools/validate_data.py
