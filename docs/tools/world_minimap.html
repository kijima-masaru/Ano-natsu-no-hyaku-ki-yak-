<title>磐戸町 ワールドミニマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ── 16色パレット（fields.json meta.palette と同一。これ以外の色は使わない） ── */
:root{
  --p0:#0b0d14; --p1:#141a2b; --p2:#1f2a44; --p3:#2f3f5f; --p4:#4a5a78; --p5:#8590a3;
  --p6:#1b2a24; --p7:#37533f; --p8:#6b8a5e; --p9:#3a2a22; --p10:#7a4a2e; --p11:#b08a5c;
  --p12:#d9d2c0; --p13:#f2e9a8; --p14:#d84a3a; --p15:#5fd0c8;
  --ground:var(--p0); --panel:var(--p1); --panel-2:var(--p2); --line:var(--p3);
  --ink:var(--p12); --ink-muted:var(--p5); --ink-faint:var(--p4);
  --accent:var(--p13); --lock:var(--p14); --focus:var(--p15);
  --pix:"DotGothic16","Zen Kaku Gothic New",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ── ヘッダ ── */
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.hd h1{font-family:var(--pix);font-weight:400;font-size:22px;line-height:1.2;margin:0;letter-spacing:.04em;text-wrap:balance}
.hd h1 small{display:block;font-size:11px;color:var(--ink-muted);letter-spacing:.14em;margin-bottom:6px}
.pal{display:flex;flex-direction:column;gap:4px}
.pal-label{font-family:var(--pix);font-size:10px;letter-spacing:.14em;color:var(--ink-muted);text-transform:uppercase}
.sw{display:grid;grid-template-columns:repeat(16,20px);gap:2px}
.sw span{display:block;width:20px;height:20px;border:1px solid var(--p0);position:relative}
.sw span::after{content:attr(data-i);position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-family:var(--pix);font-size:9px;color:var(--ink-faint)}
.sw{margin-bottom:14px}

/* ── 本体 ── */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 92px)}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}}
.stage{padding:16px 22px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--pix);font-size:12px;color:var(--ink-muted)}
.toolbar label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toolbar input{accent-color:var(--p13);width:12px;height:12px;margin:0}
.toolbar .sp{flex:1}
.compass{font-family:var(--pix);font-size:11px;color:var(--ink-faint);letter-spacing:.2em}
.mapbox{position:relative;align-self:flex-start;border:1px solid var(--line);background:var(--p1);line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;font-family:var(--pix);color:var(--ink);white-space:nowrap;line-height:1;text-shadow:1px 0 var(--p0),-1px 0 var(--p0),0 1px var(--p0),0 -1px var(--p0),1px 1px var(--p0)}
.lab b{font-weight:400;color:var(--ink-muted);margin-right:.35em}
.lab.dim{color:var(--ink-muted)}
.lab.sel{color:var(--accent)}
.lab.spine{color:var(--p5);letter-spacing:.12em}
.lab.spine.k{color:var(--p13)}
.lab.v{writing-mode:vertical-rl}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12px;color:var(--ink-muted);align-items:start;max-width:640px}
.legend .k{font-family:var(--pix);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);padding-top:2px}
.elev{display:flex;gap:2px;align-items:center}
.elev i{display:block;width:26px;height:12px;border:1px solid var(--p0)}
.elev em{font-style:normal;font-family:var(--pix);font-size:10px;margin:0 4px}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px}
.lg i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px;border:1px solid var(--p0)}
.lg .dash{background:repeating-linear-gradient(90deg,var(--p5) 0 3px,transparent 3px 5px);border:0;height:3px;vertical-align:1px;width:14px}

/* ── パネル（調査手帳） ── */
.panel{border-left:1px solid var(--line);background:var(--panel);padding:18px 20px 28px;overflow:auto;max-height:calc(100vh - 92px);position:sticky;top:0}
@media (max-width:980px){.panel{position:static;max-height:none}}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:12px;letter-spacing:.1em;padding:2px 7px;border:1px solid var(--p5);color:var(--ink)}
.chip.sel{border-color:var(--accent);color:var(--accent)}
.panel h2{font-family:var(--pix);font-weight:400;font-size:20px;margin:6px 0 0;line-height:1.3;text-wrap:balance}
.rd{font-size:12px;color:var(--ink-muted);margin:0 0 14px;letter-spacing:.04em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.meta dt{color:var(--ink-muted);font-family:var(--pix);font-size:11px;letter-spacing:.1em;padding-top:3px}
.meta dd{margin:0;font-variant-numeric:tabular-nums}
.meta code,.scene{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--p11)}
.ebar{display:inline-flex;gap:2px;vertical-align:middle;margin-right:8px}
.ebar i{width:9px;height:9px;display:block;border:1px solid var(--p0)}
.sec{margin:0 0 16px}
.sec h3{font-family:var(--pix);font-weight:400;font-size:11px;letter-spacing:.16em;color:var(--ink-muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec p{margin:0;font-size:13.5px}
.sec p.h{color:var(--p12);border-left:3px solid var(--p9);padding-left:10px}
.sec ul{margin:0;padding-left:18px;font-size:13px}
.sec li{margin:2px 0}
.ex{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
.ex li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:5px 8px;background:var(--panel-2);font-size:12.5px}
.ex li button{text-align:left;font-family:var(--pix);letter-spacing:.06em;color:var(--ink);font-size:13px}
.ex li button:hover{color:var(--accent)}
.ex .side{font-family:var(--pix);color:var(--ink-faint);font-size:11px;text-align:center;border:1px solid var(--line);padding:1px 0}
.ex .note{grid-column:2/4;color:var(--ink-muted);font-size:11.5px;margin-top:-2px}
.lk{font-family:var(--pix);font-size:10px;letter-spacing:.06em;color:var(--lock);border:1px solid var(--lock);padding:1px 5px}
.ok{font-family:var(--pix);font-size:10px;color:var(--ink-faint)}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tiles span{font-size:11.5px;padding:1px 7px;border:1px solid var(--p3);color:var(--p12);background:var(--p0)}
.foot{font-size:11px;color:var(--ink-faint);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:no-preference){.lab.sel{animation:none}}
</style>

  <h1><small>磐戸町奇譚 ── ステップ1 設計確認ツール</small>神代市 磐戸町 ワールドミニマップ</h1>

    </div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

const SHORT = {F01:"国道商業地区",F02:"於御所",F03:"高架下",F04:"八柱の谷戸",F05:"旧街道商店街",F06:"市民センター",F07:"光明院",F08:"天神社",F09:"城址",F10:"運動広場",F11:"第一小",F12:"木平団地",F13:"倉ノ前NT",F14:"朝和の里",F15:"御渡橋",F16:"薬師谷"};
const ROLE = {F01:"序盤拠点",F02:"序盤",F03:"中盤ハブ",F04:"中盤",F05:"副拠点",F06:"セーブ/情報",F07:"中盤",F08:"中盤後半",F09:"中盤・迷路",F10:"中盤",F11:"中核ダンジョン",F12:"序盤〜中盤",F13:"中盤",F14:"中盤〜終盤",F15:"境界",F16:"終盤禁域"};
const CW=32, CH=36, W=6*CW, H=6*CH;           // 内部解像度 192×216（1セル=32×36px）
const ELEV_FILL = [5,4,3,2,1,0];               // elevation 0..5 → パレットidx（低いほど明るい）
const KOKUDO = [[13,0],[13,170],[45,200],[45,216]];
const KAIDO_X = 40, KAIDO_END = 200;
const EXPWY = [[42,0],[77,18],[115,45],[128,70],[192,71]];
const TUNNEL = [90,27];
const RIVER_Y = 200;

// ── 状態（JS変数のみ。storage は使わない） ──
let selected = "F01", hovered = null, scale = 3;
const show = {conn:true, lab:true, grid:false};

const off = document.createElement("canvas"); off.width=W; off.height=H;
const oc = off.getContext("2d");
const cv = document.getElementById("map"), cx = cv.getContext("2d");
const labels = document.getElementById("labels");

const rectOf = f => { const w=f.world_pos; return {x:w.col*CW, y:w.row*CH, w:w.w*CW, h:w.h*CH}; };
const exitPt = (f,e) => { const w=f.world_pos, s=f.size_tiles, r=rectOf(f);
  return { x: Math.min(r.x+r.w-1, Math.round(r.x + e.tile[0]/s.w*r.w)), y: Math.min(r.y+r.h-1, Math.round(r.y + e.tile[1]/s.h*r.h)) }; };
const px = (x,y,c) => { oc.fillStyle=PAL[c]; oc.fillRect(x,y,1,1); };
const rect = (x,y,w,h,c) => { oc.fillStyle=PAL[c]; oc.fillRect(x,y,w,h); };
const hash = (x,y) => { let h=(x*374761393 + y*668265263) ^ 0x5bd1e995; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967296; };
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function line(x0,y0,x1,y1,c,wid=1){ // 整数ブレゼンハム
  let dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx+dy;
  for(;;){ rect(x0-Math.floor(wid/2), y0-Math.floor(wid/2), wid, wid, c);
    if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){err+=dy;x0+=sx;} if(e2<=dx){err+=dx;y0+=sy;} }
}
function poly(pts,c,wid){ for(let i=0;i<pts.length-1;i++) line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],c,wid); }

// ── 地面：西→東で暗くなるディザ勾配 + 東の樹林 ──
function drawGround(){
  const shades=[2,1,1,0];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const t=(x/W)*(shades.length-1); const i=Math.floor(t), fr=t-i;
    const c = (fr*16 > BAYER[y&3][x&3]) ? shades[Math.min(i+1,shades.length-1)] : shades[i];
    px(x,y,c);
    if(x>128 && hash(x,y)<0.10) px(x,y,6);                        // 丘陵の樹林
    if(x<32 && y>=144 && y<200 && (x%4===0) && hash(x,y)<0.5) px(x,y,6); // 南西の田園
    if(x>=160 && y>=144 && y<200 && hash(x,y)<0.06) px(x,y,7);   // 南東の河岸段丘
  }
  // 空セルの斜線（進入不可）
  const empty=[[3,1],[0,4],[5,4],[0,5],[4,5],[5,5]];
  for(const [c,r] of empty) for(let y=r*CH;y<r*CH+CH;y++) for(let x=c*CW;x<c*CW+CW;x++) if(((x+y)&7)===0 && y<RIVER_Y) px(x,y,2);
}
function drawRiver(){
  for(let y=RIVER_Y;y<H;y++) for(let x=0;x<W;x++){ px(x,y, y===RIVER_Y?3:2); if(y>RIVER_Y+1 && ((x+y*3)%11)===0) px(x,y,4); if(hash(x,y)<0.015) px(x,y,5); }
}

// ── ビオーム模様（フィールド内側 2px 余白） ──
function pattern(f,r){
  const x0=r.x+2,y0=r.y+2,x1=r.x+r.w-2,y1=r.y+r.h-2; const e=f.elevation;
  const dark = e>=4 ? 9 : 1, mid = e>=3 ? 2 : 3;
  switch(f.biome){
    case "roadside_commercial": // 店舗の箱と駐車場ライン、光源
      for(let y=y0+3;y<y1-6;y+=14){ rect(x0+3,y,10,6,5); rect(x0+4,y+1,8,4,15); rect(x0+3,y+7,10,1,13);} 
      for(let y=y0+2;y<y1;y+=3) rect(x1-12,y,10,1,4); rect(x1-4,y0+8,2,3,14); rect(x1-4,y0+30,2,3,14); break;
    case "suburban_residential": for(let y=y0+2;y<y1-4;y+=7) for(let x=x0+2;x<x1-5;x+=8){ rect(x,y,5,3,10); rect(x,y+3,5,1,9); if(hash(x,y)<0.08) px(x+2,y+1,13);} break;
    case "highway_underpass": for(let x=x0;x<x1;x+=4) rect(x,y1-5,2,4,5); rect(x0+2,y0+3,7,3,15); break;
    case "orchard_valley": for(let y=y0+1;y<y1-1;y+=4) for(let x=x0+1+((y>>2)&1)*2;x<x1-1;x+=4){ rect(x,y,2,2,7); px(x+1,y,10);} rect(x1-9,y1-8,6,4,9); px(x1-6,y1-6,13); break;
    case "old_shopping_street": for(let y=y0+1;y<y1-3;y+=4){ rect(x0+1,y,4,3,9); rect(x1-5,y,4,3,9); rect(x0+2,y+2,2,1,4); rect(x1-4,y+2,2,1,4);} rect(x0+1,y0+14,4,3,10); rect(x0+2,y0+15,2,1,13); rect(x0+1,y1-8,5,5,11); break;
    case "civic_plaza": rect(x0+2,y0+2,20,8,5); rect(x0+4,y0+4,6,3,15); rect(x0+13,y0+4,6,3,15); rect(x1-9,y0+3,4,4,4); px(x1-7,y0+2,14); rect(x0+3,y1-6,3,4,15); for(let x=x0;x<x1;x+=3) for(let y=y0+12;y<y1-8;y+=3) px(x,y,4); break;
    case "temple_precinct": rect(x0+18,y0+8,12,10,9); rect(x0+20,y0+10,8,6,10); rect(x0+23,y0+12,2,2,13); for(let y=y0+4;y<y1-3;y+=4) for(let x=x0+3;x<x0+14;x+=4) rect(x,y,2,3,5); for(let x=x0+2;x<x1-2;x+=5) px(x,y0+1,11); rect(x1-3,y0+8,2,2,5); break;
    case "hilltop_shrine": for(let y=y0+1;y<y1-1;y+=3) for(let x=x0+1+(((y/3)|0)&1)*2;x<x1-1;x+=4) px(x,y,12); rect(x0+3,y0+1,2,y1-y0-2,5); rect(x0+3,y0+1,2,2,4); rect(x1-11,y0+6,8,6,9); rect(x1-9,y0+8,4,3,10); px(x1-7,y0+5,13); break;
    case "castle_ruins": rect(x0+4,y0+4,x1-x0-8,y1-y0-8,7); rect(x0+7,y0+7,x1-x0-14,y1-y0-14,dark); rect(x0+12,y0+12,x1-x0-24,y1-y0-24,7); rect(x0+15,y0+15,x1-x0-30,y1-y0-30,dark); rect(x0+4,y0+18,x1-x0-8,2,dark); rect(x0+9,y0+18,4,2,7); rect(x1-7,y0+4,3,3,dark); px(x0+20,y0+20,13); break;
    case "riverside_ground": rect(x0+6,y0+4,x1-x0-14,y1-y0-10,10); rect(x0+7,y0+5,x1-x0-16,y1-y0-12,11); rect(x0+7,y0+9,x1-x0-16,1,12); rect(x0+7,y1-11,x1-x0-16,1,12); rect(x0+2,y0+2,3,3,5); rect(x1-5,y0+3,1,6,5); px(x1-5,y0+2,13); for(let x=x0;x<x1;x+=2) px(x,y1-1,7); break;
    case "school_dungeon": rect(x0+3,y0+3,22,8,5); rect(x0+5,y0+5,3,2,15); rect(x0+3,y1-11,20,8,10); rect(x0+4,y1-10,18,6,9); rect(x0+7,y1-8,2,2,13); rect(x0+13,y1-8,2,2,15); for(let x=x0+28;x<x1-2;x+=3) for(let y=y0+4;y<y1-3;y+=3) px(x,y,11); rect(x0+33,y0+12,6,1,12); break;
    case "housing_estate": for(let x=x0+3;x<x1-10;x+=9){ rect(x,y0+3,6,y1-y0-12,5); for(let y=y0+5;y<y1-11;y+=3) px(x+2,y,dark); px(x+2,y0+5+3*((x/9|0)%3),15);} rect(x1-8,y0+3,6,5,4); rect(x1-8,y1-8,6,4,11); break;
    case "newtown_residential": for(let y=y0+2;y<y1-3;y+=5) for(let x=x0+2;x<x1-3;x+=5){ rect(x,y,3,3,[10,9,11][(((x/5)|0)+((y/5)|0))%3]); if(((x/5)|0)%3===0) px(x+4,y+4,13);} break;
    case "paddy_shrine": for(let y=y0+1;y<y1-1;y++) for(let x=x0+1;x<x1-1;x++){ if(y%6===0||x%8===0) px(x,y,mid); else px(x,y,7);} rect(x1-16,y0+3,7,6,9); rect(x1-14,y0+5,3,2,13); rect(x0+4,y1-9,6,5,6); rect(x0+12,y1-8,5,4,6); rect(x0+19,y1-9,6,5,6); break;
    case "riverbank_bridge": for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++) if(((x+y)&1)===0 || hash(x,y)<0.2) px(x,y,4); for(let x=x0;x<x1;x+=3) px(x,y0+2,7); break;
    case "forbidden_valley_temple": for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) if(((x-y)&5)===0) px(x,y,9); rect(x0+4,y0+8,x1-x0-8,8,dark); rect(x0+6,y0+10,x1-x0-12,4,9); px(x0+((x1-x0)>>1),y0+12,12); break;
  }
}

function drawOutlines(){
  for(const f of FIELDS){ const r=rectOf(f); oc.fillStyle=PAL[5];
    oc.fillRect(r.x,r.y,r.w,1); oc.fillRect(r.x,r.y+r.h-1,r.w,1); oc.fillRect(r.x,r.y,1,r.h); oc.fillRect(r.x+r.w-1,r.y,1,r.h); }
}

function drawFields(){
  for(const f of FIELDS){ const r=rectOf(f); rect(r.x,r.y,r.w,r.h,ELEV_FILL[f.elevation]); pattern(f,r); }
}
function drawSpines(){
  // 旧・鹿之尾街道
  rect(KAIDO_X, 0, 2, KAIDO_END, 4); for(let y=2;y<KAIDO_END;y+=6) px(KAIDO_X, y, 3);
  // 国道281号（唯一の光源）
  poly(KOKUDO, 5, 3); for(let y=2;y<170;y+=6) px(13,y,12);
  for(let y=4;y<170;y+=8){ px(11,y,13); px(15,y+4,13); }
  for(let y=172;y<216;y+=8){ const t=(y-170)/30, x=Math.round(13+32*Math.min(t,1)); px(x-2,y,13); px(x+2,y+4,13); }
  // 御渡橋
  rect(43,RIVER_Y-1,5,17,5); rect(44,RIVER_Y,3,15,4); rect(43,RIVER_Y+15,5,2,0); rect(43,RIVER_Y+13,5,1,14); px(42,RIVER_Y+3,13); px(48,RIVER_Y+9,13);
  // 渡し場跡
  rect(39,RIVER_Y-2,4,2,11);
  // 東海縦貫道：影→床版→防音壁
  poly(EXPWY.map(p=>[p[0]+1,p[1]+2]), 0, 5);
  poly(EXPWY, 4, 5); poly(EXPWY.map(p=>[p[0],p[1]-3]), 5, 1); poly(EXPWY.map(p=>[p[0],p[1]+3]), 5, 1);
  for(let i=0;i<EXPWY.length-1;i++){ const [ax,ay]=EXPWY[i],[bx,by]=EXPWY[i+1], n=Math.hypot(bx-ax,by-ay)|0; for(let k=0;k<n;k+=5){ px(Math.round(ax+(bx-ax)*k/n), Math.round(ay+(by-ay)*k/n), 2);} }
  // 隧道（F03）とその北口→F04/F09への法面下の道
  rect(TUNNEL[0]-1,TUNNEL[1]-3,3,7,0); px(TUNNEL[0],TUNNEL[1]-3,12); px(TUNNEL[0],TUNNEL[1]+3,12);
  line(TUNNEL[0],TUNNEL[1]-4,127,8,9,1); line(TUNNEL[0],TUNNEL[1]-4,110,26,9,1); line(110,26,127,33,9,1);
  // 法面の階段（F03南側→F06）
  for(let y=30;y<36;y+=2) rect(73,y,3,1,5);
}

function drawConnections(){
  const done=new Set();
  for(const f of FIELDS) for(const e of f.exits){
    const key=[f.id,e.to].sort().join("-"); if(done.has(key)) continue; done.add(key);
    const t=BY[e.to], back=t.exits.find(x=>x.to===f.id); const a=exitPt(f,e), b=exitPt(t,back);
    const c = e.lock ? 14 : 12;
    const hi = selected && (f.id===selected||t.id===selected);
    if(Math.hypot(a.x-b.x,a.y-b.y)>4){ // 隧道経路（点線）
      const n=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)); for(let k=0;k<=n;k+=2) px(Math.round(a.x+(b.x-a.x)*k/n),Math.round(a.y+(b.y-a.y)*k/n),c);
    }
    const mx=Math.round((a.x+b.x)/2), my=Math.round((a.y+b.y)/2);
    rect(mx-1,my-1,4,4,0); rect(mx,my,2,2,c);
    if(hi){ rect(mx-2,my-2,6,1,c); rect(mx-2,my+3,6,1,c); rect(mx-2,my-1,1,4,c); rect(mx+3,my-1,1,4,c); }
  }
}

function drawGrid(){ for(let c=1;c<6;c++) for(let y=0;y<H;y+=2) px(c*CW,y,15); for(let r=1;r<6;r++) for(let x=0;x<W;x+=2) px(x,r*CH,15); }

function drawHighlight(){
  const draw=(id,c,inset)=>{ const r=rectOf(BY[id]); oc.fillStyle=PAL[c];
    oc.fillRect(r.x+inset,r.y+inset,r.w-2*inset,1); oc.fillRect(r.x+inset,r.y+r.h-1-inset,r.w-2*inset,1);
    oc.fillRect(r.x+inset,r.y+inset,1,r.h-2*inset); oc.fillRect(r.x+r.w-1-inset,r.y+inset,1,r.h-2*inset); };
  if(selected){ draw(selected,13,0); draw(selected,0,1); for(const e of BY[selected].exits) draw(e.to, e.lock?14:5, 0); }
  if(hovered && hovered!==selected) draw(hovered,15,0);
}

function render(){
  drawGround(); drawFields(); drawRiver(); drawOutlines(); drawSpines();
  if(show.grid) drawGrid();
  if(show.conn) drawConnections();
  drawHighlight();
  cx.imageSmoothingEnabled=false; cx.clearRect(0,0,cv.width,cv.height); cx.drawImage(off,0,0,W*scale,H*scale);
  renderLabels();
}

function renderLabels(){
  labels.innerHTML="";
  if(!show.lab) return;
  const fs = Math.max(9, 3*scale+1);
  const add=(txt,x,y,cls,big)=>{ const d=document.createElement("div"); d.className="lab "+(cls||""); d.innerHTML=txt;
    d.style.left=(x*scale)+"px"; d.style.top=(y*scale)+"px"; d.style.fontSize=(big?fs:Math.max(8,fs-2))+"px"; labels.appendChild(d); };
  for(const f of FIELDS){ const r=rectOf(f); const sel=f.id===selected;
    add(`<b>${f.id}</b>${SHORT[f.id]}`, r.x+3, r.y+3, sel?"sel":(f.elevation>=4?"dim":""), true); }
  add("国道281号", 16, 60, "spine k v"); add("旧鹿之尾街道", 43, 112, "spine v"); add("東海縦貫道", 96, 19, "spine"); add("蒼籠川", 140, 205, "spine");
  add("隧道", TUNNEL[0]+3, TUNNEL[1]-1, "spine"); add("御渡橋", 49, 202, "spine"); add("渡し場跡", 24, 190, "spine");
  add("法面", 104, 52, "spine"); add("断崖", 152, 34, "spine");
}

function fit(){
  const avail = document.querySelector(".stage").clientWidth - 2;
  const availH = Math.max(360, window.innerHeight - 250);
  scale = Math.max(2, Math.min(5, Math.floor(Math.min(avail/W, availH/H))));
  cv.width=W*scale; cv.height=H*scale; cv.style.width=cv.width+"px"; cv.style.height=cv.height+"px";
  render();
}

function fieldAt(ev){ const b=cv.getBoundingClientRect(); const x=(ev.clientX-b.left)/scale, y=(ev.clientY-b.top)/scale;
  return FIELDS.find(f=>{const r=rectOf(f); return x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;}); }
cv.addEventListener("mousemove",ev=>{ const f=fieldAt(ev); const id=f?f.id:null; if(id!==hovered){hovered=id; cv.style.cursor=f?"pointer":"default"; render();} });
cv.addEventListener("mouseleave",()=>{hovered=null;render();});
cv.addEventListener("click",ev=>{ const f=fieldAt(ev); if(f) select(f.id); });
for(const [k,id] of [["conn","tgConn"],["lab","tgLab"],["grid","tgGrid"]]) document.getElementById(id).addEventListener("change",e=>{show[k]=e.target.checked;render();});
window.addEventListener("resize",fit);

// ── パネル ──
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function select(id){ selected=id; render(); renderPanel(); }
function renderPanel(){
  const f=BY[selected]; const s=f.size_tiles, wp=f.world_pos; const tiles=s.w*s.h;
  const ebar = [0,1,2,3,4,5].map(i=>`<i style="background:${i<=f.elevation?PAL[ELEV_FILL[i]]:PAL[1]};opacity:${i<=f.elevation?1:.35}"></i>`).join("");
  const ELEV_NAME=["河畔","低地","微高地","寺町の丘","谷戸・丘陵","山頂・禁域"];
  const exits = f.exits.map(e=>{ const t=BY[e.to]; return `<li><span class="side">${e.side}</span><button type="button" data-go="${e.to}">${e.to} ${esc(t.name)}</button>${e.lock?`<span class="lk">${esc(e.lock)}</span>`:`<span class="ok">開放</span>`}<span class="note">${esc(e.note||"")}${e.lock?` ── ${esc(DATA.meta.locks[e.lock]||"")}`:""}</span></li>`; }).join("");
  document.getElementById("panel").innerHTML = `
    <div class="ph"><span class="chip sel">${f.id}</span><span class="chip">${esc(ROLE[f.id]||"")}</span><span class="chip" title="biome">${esc(f.biome)}</span></div>
    <h2>${esc(f.name)}</h2>
    <p class="rd">${esc(f.reading)}</p>
    <dl class="meta">
      <dt>標高</dt><dd><span class="ebar">${ebar}</span>${f.elevation} / 5 ── ${ELEV_NAME[f.elevation]}</dd>
      <dt>面積</dt><dd>${s.w} × ${s.h} タイル ＝ ${tiles.toLocaleString()} タイル（${s.w*16} × ${s.h*16} px ／ 画面 ${(s.w/24).toFixed(1)} × ${(s.h/13.5).toFixed(1)} 枚分）</dd>
      <dt>配置</dt><dd>col ${wp.col} · row ${wp.row}（${wp.w}×${wp.h} セル）</dd>
      <dt>アクセント</dt><dd>${esc(f.palette_accent)} <span style="display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px">${(f.palette_accent_idx||[]).map(i=>`<i style="display:block;width:10px;height:10px;background:${PAL[i]};border:1px solid ${PAL[0]}" title="idx ${i}"></i>`).join("")}</span></dd>
      <dt>シーン</dt><dd><span class="scene">${esc(f.scene_path)}</span></dd>
      ${f.unlock_flag?`<dt>進入条件</dt><dd><span class="lk">${esc(f.unlock_flag)}</span> ${esc(DATA.meta.locks[f.unlock_flag]||"")}</dd>`:""}
    </dl>
    <div class="sec"><h3>雰囲気</h3><p>${esc(f.ambience)}</p></div>
    <div class="sec"><h3>接続先 ${f.exits.length}</h3><ul class="ex">${exits}</ul></div>
    <div class="sec"><h3>想定される調べもの</h3><ul>${f.interactables.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>恐怖演出の方向性</h3><p class="h">${esc(f.horror_beat)}</p></div>
    <div class="sec"><h3>物語上の役割</h3><p>${esc(f.story_role)}</p></div>
    <div class="sec"><h3>ランドマーク</h3><ul>${f.landmarks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>必要タイル種別 ${f.required_tiles.length}</h3><div class="tiles">${f.required_tiles.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
    <p class="foot">1タイル=16px。基準解像度 384×216 は 24×13.5 タイル。全データは <span class="scene">res://data/fields.json</span> と同一。</p>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.go)));
}

// ── 凡例・スウォッチ ──
document.getElementById("sw").innerHTML = DATA.meta.palette.map(p=>`<span data-i="${p.idx}" style="background:${p.hex}" title="${p.idx} ${p.name} ${p.hex} ── ${p.role}"></span>`).join("");
document.getElementById("elevLegend").innerHTML = `<em>0 河畔</em>` + [0,1,2,3,4,5].map(i=>`<i style="background:${PAL[ELEV_FILL[i]]}" title="標高 ${i}"></i>`).join("") + `<em>5 山頂</em>`;

fit(); renderPanel();
</script>
